# Baut die Web-Version als Docker-Image (deploy/Dockerfile), legt es in die GitHub Container Registry
# (ghcr.io) und deployt es nach CapRover. Läuft bei jedem gepushten Tag „v*“ und nach jedem
# erfolgreichen Lauf von „Setups“ – der legt das Tag „v<Version>“ selbst an, und von Workflows
# angelegte Tags lösen keinen push-Lauf aus. Einrichtung siehe README („Automatischer Deploy“).
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [Setups]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mannimanfred/tupfer-web

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Version lesen
        run: |
          echo "VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)" >> "$GITHUB_ENV"
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:v${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Nach CapRover deployen
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
          CAPROVER_APP: ${{ vars.CAPROVER_APP || 'tupfer' }}
        run: |
          npx -y caprover deploy \
            --caproverUrl "$CAPROVER_URL" \
            --appToken "$CAPROVER_APP_TOKEN" \
            --appName "$CAPROVER_APP" \
            --imageName "$IMAGE:$SHA"
