<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <!-- Kein Zoomen durch den Browser: die App zoomt selbst (zwei Finger); Firefox zoomt sonst teils heraus -->
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tupfer Designer – eigene tiptoi-Seiten gestalten</title>
  <meta name="description" content="Kostenloser Editor für eigene tiptoi-Seiten: Bilder und Texte gestalten, OID-Codes drucken, Sprachausgabe und Spiele programmieren, GME-Datei für den Stift bauen – im Browser oder als App für Windows, Linux und macOS." />
  <meta name="keywords" content="tiptoi, tiptoi selber machen, eigene tiptoi Bücher, tiptoi erstellen, GME, OID-Codes, tttool, Ravensburger, Lernspiele, Kinder" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Tupfer Designer – eigene tiptoi-Seiten gestalten" />
  <meta property="og:description" content="Kostenloser Editor für eigene tiptoi-Seiten: Bilder und Texte gestalten, OID-Codes drucken, Sprachausgabe und Spiele programmieren, GME-Datei für den Stift bauen – im Browser oder als App für Windows, Linux und macOS." />
  <meta property="og:url" content="https://mannimanfred.github.io/Tupfer/" />
  <meta property="og:image" content="https://mannimanfred.github.io/Tupfer/favicon.png" />
  <link rel="canonical" href="https://mannimanfred.github.io/Tupfer/" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="modulepreload" href="./main.js" />
  <link rel="stylesheet" href="./app.css" />
  <script>
    // Lade-Bildschirm gleich in der gewählten Darstellung (Einstellung des Designers, sonst ?darstellung=…
    // aus Nextcloud, sonst prefers-color-scheme per CSS)
    (() => {
      let theme;
      try {
        theme = JSON.parse(localStorage.getItem('tupfer-einstellungen') || '{}').Theme;
      } catch { }
      if (theme !== 'Light' && theme !== 'Dark') {
        const query = new URLSearchParams(location.search).get('darstellung');
        theme = query === 'dunkel' ? 'Dark' : query === 'hell' ? 'Light' : undefined;
      }
      if (theme)
        document.documentElement.dataset.theme = theme === 'Dark' ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <div id="out">
    <div id="loading">
      <img src="favicon.png" alt="" width="64" height="64" />
      <p>Tupfer Designer wird geladen …</p>
      <p id="loading-slow" hidden>Das dauert ungewöhnlich lange. Hilft Neuladen nicht, bitte die Website-Daten
        dieser Seite im Browser löschen.</p>
      <pre id="loading-error" hidden></pre>
    </div>
  </div>
  <script>
    // Fehler beim Start auf der Ladeseite anzeigen (auf dem Handy gibt es keine Konsole), solange die App
    // noch nicht läuft. Meldungen der .NET-Laufzeit über console.error werden nur gesammelt (darunter auch
    // harmlose, z. B. Rückfall auf Software-Darstellung) und erst bei einem Fehler oder langem Warten gezeigt.
    (() => {
      const messages = [];
      const remember = text => {
        messages.push(String(text));
        if (messages.length > 30) messages.shift();
      };
      const show = title => {
        if (window.tupferStarted || !document.getElementById('loading')) return;
        const box = document.getElementById('loading-error');
        box.textContent = title + '\n' + messages.join('\n');
        box.hidden = false;
      };
      const consoleError = console.error;
      console.error = (...args) => {
        consoleError.apply(console, args);
        remember(args.map(a => a?.message ?? a).join(' '));
      };
      const fail = text => {
        remember(text);
        show('Fehler beim Laden:');
      };
      window.addEventListener('error', e => fail(e.error?.message ?? e.message ?? `Datei konnte nicht geladen werden: ${e.target?.src ?? e.target?.href ?? '?'}`), true);
      window.addEventListener('unhandledrejection', e => fail(e.reason?.message ?? e.reason));
      window.tupferStartError = fail;
      // Hängt der Start ohne Fehler, wenigstens darauf hinweisen (mit den bisherigen Meldungen)
      setTimeout(() => {
        if (window.tupferStarted) return;
        document.getElementById('loading-slow').hidden = false;
        if (messages.length > 0) show('Meldungen:');
      }, 60000);
    })();
  </script>
  <script type="module" src="./main.js" onerror="tupferStartError('main.js konnte nicht geladen werden')"></script>
</body>
</html>
