server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vorkomprimierte Dateien (*.gz) aus dem Publish ausliefern
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;

    # Dateien in _framework tragen einen Hash im Namen und ändern sich nie
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Startseite und Skripte immer neu prüfen, damit ein neuer Stand sofort ankommt
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
