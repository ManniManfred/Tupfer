server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vorkomprimierte Dateien (*.gz) aus dem Publish ausliefern
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;

    # Dateien mit Hash im Namen (z. B. Avalonia.Base.s8hkupy3c6.wasm) ändern sich nie
    location ~ "^/_framework/.+\.[a-z0-9]{10}\.[a-z]+(\.gz|\.br)?$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Alle übrigen (u. a. dotnet.js mit der Liste der App-Dateien) immer neu prüfen,
    # sonst bleibt der Browser beim alten Stand
    location /_framework/ {
        add_header Cache-Control "no-cache";
    }

    # Startseite und Skripte immer neu prüfen, damit ein neuer Stand sofort ankommt
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
