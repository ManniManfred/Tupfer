# Baut die Setups des Tupfer Designers für Windows, Linux und macOS und veröffentlicht sie als
# GitHub-Release „v<Version>“ (Version aus Directory.Build.props). Die Download-Seite der Web-App
# (Tupfer.Designer.Browser/wwwroot/download.html) verlinkt immer auf das neueste Release.
name: Setups

on:
  push:
    branches: [master]
    # Nur wenn die Versionsnummer (bei jeder Änderung an der App) oder die Setups selbst geändert wurden
    paths: [Directory.Build.props, deploy/setup/**, nextcloud/**, .github/workflows/setups.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: setups
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version lesen
        run: echo "VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)" >> "$GITHUB_ENV"
      - name: Veröffentlichen
        run: dotnet publish Tupfer.Designer -c Release -r ${{ matrix.rid }} --self-contained -o publish/${{ matrix.rid }}

      - name: Windows-Setup
        if: matrix.rid == 'win-x64'
        # PowerShell statt Git Bash, das Optionen wie /DSource=… sonst als Pfad umschreibt
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$env:VERSION" "/DSource=..\..\publish\win-x64" "/DOutput=..\..\setups" deploy\setup\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux-Pakete
        if: matrix.rid == 'linux-x64'
        run: deploy/setup/linux.sh $VERSION publish/linux-x64 setups
      - name: macOS-Abbild
        if: startsWith(matrix.rid, 'osx-')
        run: |
          arch=${{ matrix.rid }}
          deploy/setup/macos.sh $VERSION publish/${{ matrix.rid }} setups/Tupfer-Designer-macOS-${arch#osx-}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.rid }}
          path: setups/*

  nextcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: WebAssembly-Werkzeuge installieren
        run: dotnet workload install wasm-tools
      - name: Nextcloud-App bauen
        run: nextcloud/build.sh setups
      - uses: actions/upload-artifact@v4
        with:
          name: setup-nextcloud
          path: setups/*

  release:
    needs: [build, nextcloud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version lesen
        run: echo "VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: setups
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Tupfer Designer ${{ env.VERSION }}
          make_latest: true
          files: setups/*
          body: |
            Setups des Tupfer Designers ${{ env.VERSION }}:

            - **Windows:** `Tupfer-Designer-Setup-Windows-x64.exe`
            - **Linux:** `Tupfer-Designer-Linux-x64.deb` (Debian, Ubuntu, Mint …) oder `Tupfer-Designer-Linux-x64.AppImage` (alle Distributionen, ohne Installation)
            - **macOS:** `Tupfer-Designer-macOS-arm64.dmg` (Apple-Chip M1 und neuer) oder `Tupfer-Designer-macOS-x64.dmg` (Intel)
            - **Nextcloud:** `Tupfer-Designer-Nextcloud.tar.gz` (App für Nextcloud 28–35, Installation siehe README)

            Die Setups sind nicht signiert: Windows fragt beim ersten Start nach („Weitere Informationen → Trotzdem ausführen“),
            unter macOS die App beim ersten Mal per Rechtsklick → „Öffnen“ starten.
