# Baut die Browser-Version des Tupfer Designers und veröffentlicht sie auf GitHub Pages.
# Einmalig nötig: Repository → Settings → Pages → Source: „GitHub Actions“ (für private Repositories
# nur mit bezahltem GitHub-Plan). Ist Pages nicht eingeschaltet, wird nur gebaut und eine Warnung gezeigt.
name: Web-Version

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Prüfen, ob GitHub Pages eingeschaltet ist
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages nicht eingeschaltet::Die Web-Version wird nur gebaut, nicht veröffentlicht. Einschalten unter Settings → Pages → Source: „GitHub Actions“ (private Repositories brauchen einen bezahlten Plan)."
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: WebAssembly-Werkzeuge installieren
        run: dotnet workload install wasm-tools
      - name: Veröffentlichen
        run: dotnet publish Tupfer.Designer.Browser -c Release -o publish
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
